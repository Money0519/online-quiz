<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 題線上小測驗</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .question { margin-top: 20px; margin-bottom: 10px; font-weight: bold; color: #444; }
        .options label { display: block; margin: 8px 0; cursor: pointer; font-weight: normal; }
        button { display: block; width: 100%; background: #2ea44f; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 25px; }
        button:hover { background: #2c974b; }
        #result { text-align: center; font-size: 20px; font-weight: bold; margin-top: 20px; color: #2ea44f; }
    </style>
</head>
<body>

<div class="container">
    <h1>綜合知識常識測驗</h1>
    <form id="quizForm">
        <!-- 第 1 題 -->
        <div class="question">1. 法國的首都是哪裡？</div>
        <div class="options">
            <label><input type="radio" name="q1" value="wrong"> 倫敦</label>
            <label><input type="radio" name="q1" value="correct"> 巴黎</label>
            <label><input type="radio" name="q1" value="wrong"> 柏林</label>
        </div>

        <!-- 第 2 題 -->
        <div class="question">2. 太陽系中哪顆行星被稱為「紅色星球」？</div>
        <div class="options">
            <label><input type="radio" name="q2" value="correct"> 火星</label>
            <label><input type="radio" name="q2" value="wrong"> 金星</label>
            <label><input type="radio" name="q2" value="wrong"> 木星</label>
        </div>

        <!-- 第 3 題 -->
        <div class="question">3. 算術題：5 + 5 等於多少？</div>
        <div class="options">
            <label><input type="radio" name="q3" value="wrong"> 8</label>
            <label><input type="radio" name="q3" value="wrong"> 12</label>
            <label><input type="radio" name="q3" value="correct"> 10</label>
        </div>

        <!-- 第 4 題 -->
        <div class="question">4. 地球上最大的海洋是哪一個？</div>
        <div class="options">
            <label><input type="radio" name="q4" value="wrong"> 大西洋</label>
            <label><input type="radio" name="q4" value="correct"> 太平洋</label>
            <label><input type="radio" name="q4" value="wrong"> 印度洋</label>
        </div>

        <!-- 第 5 題 -->
        <div class="question">5. 經典名劇《羅密歐與茱麗葉》的作者是誰？</div>
        <div class="options">
            <label><input type="radio" name="q5" value="correct"> 莎士比亞</label>
            <label><input type="radio" name="q5" value="wrong"> 查爾斯·狄更斯</label>
            <label><input type="radio" name="q5" value="wrong"> 馬克·吐溫</label>
        </div>

        <!-- 第 6 題 -->
        <div class="question">6. 水的化學式是什麼？</div>
        <div class="options">
            <label><input type="radio" name="q6" value="wrong"> CO2</label>
            <label><input type="radio" name="q6" value="correct"> H2O</label>
            <label><input type="radio" name="q6" value="wrong"> O2</label>
        </div>

        <!-- 第 7 題 -->
        <div class="question">7. 地球上一共有幾個大洲？</div>
        <div class="options">
            <label><input type="radio" name="q7" value="wrong"> 5 個</label>
            <label><input type="radio" name="q7" value="wrong"> 6 個</label>
            <label><input type="radio" name="q7" value="correct"> 7 個</label>
        </div>

        <!-- 第 8 題 -->
        <div class="question">8. 自然界中最堅硬的天然物質是什麼？</div>
        <div class="options">
            <label><input type="radio" name="q8" value="correct"> 鑽石</label>
            <label><input type="radio" name="q8" value="wrong"> 黃金</label>
            <label><input type="radio" name="q8" value="wrong"> 鋼鐵</label>
        </div>

        <!-- 第 9 題 -->
        <div class="question">9. 植物進行光合作用主要吸收什麼氣體？</div>
        <div class="options">
            <label><input type="radio" name="q9" value="wrong"> 氧氣</label>
            <label><input type="radio" name="q9" value="correct"> 二氧化碳</label>
            <label><input type="radio" name="q9" value="wrong"> 氮氣</label>
        </div>

        <!-- 第 10 題 -->
        <div class="question">10. 著名的吉薩金字塔位於哪一個國家？</div>
        <div class="options">
            <label><input type="radio" name="q10" value="wrong"> 墨西哥</label>
            <label><input type="radio" name="q10" value="wrong"> 希臘</label>
            <label><input type="radio" name="q10" value="correct"> 埃及</label>
        </div>

        <button type="button" onclick="calculateScore()">送出答案</button>
    </form>
    <div id="result"></div>
</div>

<script>
    function calculateScore() {
        let score = 0;
        const total = 10;
        for (let i = 1; i <= total; i++) {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            if (selected && selected.value === "correct") {
                score++;
            }
        }
        document.getElementById("result").innerText = `你的得分是：${score} / ${total} 分！`;
    }
</script>

</body>
</html>
